name: Validate packages

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate package layout and artifact policy
        shell: bash
        run: python3 Tools/ci/validate-package-layout.py
