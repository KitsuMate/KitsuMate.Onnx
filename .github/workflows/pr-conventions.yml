name: PR conventions

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate pull request title and branch
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            const branch = context.payload.pull_request.head.ref;
            const titlePattern = /^(feat|fix|docs|test|ci|build|chore|refactor|perf)\((core|onnxruntime|unity-inference|asr|embeddings|lipsync|motion|tts|tokenizers|ci|release|docs|repo)\)!?: [a-z][^.]*(?<!\.)$/;
            const branchPattern = /^(feat|fix|docs|test|ci|build|chore|refactor|perf)\/(core|onnxruntime|unity-inference|asr|embeddings|lipsync|motion|tts|tokenizers|ci|release|docs|repo)-[a-z0-9]+(?:-[a-z0-9]+)*$/;
            const automationBranch = /^(dependabot\/|release-please--)/;
            const errors = [];

            if (!titlePattern.test(title)) {
              errors.push('PR title must use `type(scope): imperative summary` (add `!` before `:` for breaking changes).');
            }
            if (!automationBranch.test(branch) && !branchPattern.test(branch)) {
              errors.push('Branch must use `type/scope-short-description` in lower-case kebab case.');
            }
            if (errors.length > 0) {
              core.setFailed(errors.join('\n'));
            }
