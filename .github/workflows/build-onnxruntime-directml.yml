name: Build ONNX Runtime DirectML artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  directml:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: microsoft/onnxruntime
          ref: 8a77e459420f58fb946fd9067285cfa719f10bdd
          submodules: recursive
          path: onnxruntime-source
      - name: Build pinned DirectML core
        shell: pwsh
        run: >-
          ./Tools/native/build-ort-1.25.1-windows.ps1
          -Provider DirectML
          -Source "$env:GITHUB_WORKSPACE/onnxruntime-source"
          -Output "$env:RUNNER_TEMP/directml"
      - name: Package maintainer build output
        shell: pwsh
        run: |
          Get-ChildItem "$env:RUNNER_TEMP/directml" -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content "$env:RUNNER_TEMP/directml/SHA256SUMS" -Encoding utf8
          Compress-Archive "$env:RUNNER_TEMP/directml/*" "$env:RUNNER_TEMP/kitsumate-onnxruntime-directml-win-x64-1.25.1.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: kitsumate-onnxruntime-directml-win-x64-1.25.1
          path: ${{ runner.temp }}/kitsumate-onnxruntime-directml-win-x64-1.25.1.zip
          if-no-files-found: error
